name: Trigger auto deployment for nexorderproductserviceapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/nexorderproductserviceapp-AutoDeployTrigger-8f7abee6-0e57-4c69-9984-480dc15f5df4.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NEXORDERPRODUCTSERVICEAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NEXORDERPRODUCTSERVICEAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NEXORDERPRODUCTSERVICEAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: practiceregistry.azurecr.io
          registryUsername: ${{ secrets.NEXORDERPRODUCTSERVICEAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NEXORDERPRODUCTSERVICEAPP_REGISTRY_PASSWORD }}
          containerAppName: nexorderproductserviceapp
          resourceGroup: PracticeGroup
          imageToBuild: practiceregistry.azurecr.io/nexorderproductserviceapp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


